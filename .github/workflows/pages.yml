name: Deploy to GitHub Pages

# main에 push할 때마다 정적 사이트(단일 index.html PWA)를 그대로 GitHub Pages에 배포한다.
# 빌드 단계 없음 — 저장소 루트를 그대로 올린다(.git/.github/docs/scratch 제외).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 진행 중이면 새 것으로 교체하되 실행 중인 것은 취소하지 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage site files
        run: |
          mkdir _site
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'docs' \
            --exclude 'scratch' \
            --exclude '_site' \
            ./ _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
